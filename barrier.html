<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Режим Барьер</title>

    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/mL5KpfC/0800b2f7-2882-4660-8fe3-a7e35bf26abf.jpg">
    <meta name="theme-color" content="#7f1d1d">

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #7f1d1d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Белые полосы, бегущие по фону */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.12) 0px,
                rgba(255, 255, 255, 0.12) 20px,
                transparent 20px,
                transparent 60px
            );
            animation: stripesMove 4s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes stripesMove {
            from { transform: translate(0, 0); }
            to   { transform: translate(60px, 60px); }
        }

        /* Пульсирующее свечение */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(220, 38, 38, 0.5) 0%, transparent 70%);
            animation: pulseGlow 2s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .icon {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.6));
            animation: iconPulse 1.8s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(0, 0, 0, 0.25);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 1.5rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fca5a5;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.8); }
        }

        .footer-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Режим Барьер</h1>
        <div class="message">
            Включён режим <strong>Барьер</strong>.<br>
            Сайт возобновит работу через некоторое время.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6GGJxAiao77U7_9mBUEjftmS_FnSWbIw",
            authDomain: "glob-data.firebaseapp.com",
            projectId: "glob-data",
            storageBucket: "glob-data.firebasestorage.app",
            messagingSenderId: "122757049174",
            appId: "1:122757049174:web:ebb425edd0e1a8ea9a44f7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const myGlobalId = sessionStorage.getItem('gdz_globalId') || '';

        // Каждые 2 секунды проверяем, не выключен ли барьер
        async function checkBarrier() {
            try {
                const fileDoc = await db.collection('GDZ').doc('file').get();
                if (!fileDoc.exists) return;

                const data = fileDoc.data();
                const barrier = data.barrier;
                const target = data.barrierTarget;

                // Если барьер выключен или это не для нас — возвращаемся
                const barrierForMe =
                    barrier === 'on' &&
                    (target === null || target === undefined || target === myGlobalId);

                if (!barrierForMe) {
                    // Возвращаемся туда, откуда пришли (или в index)
                    const back = sessionStorage.getItem('barrier_back') || 'index.html';
                    window.location.replace(back);
                }
            } catch (e) {
                console.warn('Ошибка проверки барьера:', e);
            }
        }

        setInterval(checkBarrier, 2000);
        checkBarrier(); // сразу при загрузке
    </script>
</body>
</html>
